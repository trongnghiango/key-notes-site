{{ define "main" }}
<main id="private-archive">
  <header class="archive-header" style="margin-bottom: 2rem;">
    <div style="display:inline-flex; align-items:center; gap:6px; margin-bottom:8px; padding:4px 10px; border-radius:6px; background:#ef444415; border:1px solid #ef444440; color:#ef4444; font-size:0.85em; font-weight:600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span>Khu vực bảo mật (Private Vault)</span>
    </div>
    <h1 class="archive-title" style="margin-top: 0; font-size: 2.2rem;">Private Notes</h1>
    <p style="color: var(--text-muted); margin-top: 6px; font-size: 1rem;">
      Tổng cộng <strong>{{ len .Pages }}</strong> ghi chú riêng tư. Toàn bộ nội dung được bảo vệ bởi Cloudflare Edge Guard.
    </p>
  </header>

  <ul class="timeline-list">
    {{ range .Pages }}
      <li class="timeline-item">
        <span class="timeline-date">{{ .Date.Format "02/01" }}</span>
        <a class="timeline-link" href="{{ .RelPermalink }}">{{ .Title }}</a>
        <div class="timeline-meta">
          <span class="badge-private" style="padding:1px 6px; font-size:0.75rem; border-radius:3px; background:#ef444420; color:#ef4444; border:1px solid #ef444450;">🔒 Private</span>
          <span class="timeline-reading-time">{{ .ReadingTime }}p</span>
        </div>
      </li>
    {{ end }}
  </ul>
</main>
{{ end }}
