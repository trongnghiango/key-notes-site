{{/* Hugo Code Block Render Hook with Modern Header */}}
<div class="code-block-wrapper" data-code="{{ .Inner | safeJS }}" {{ with .Type }}data-lang="{{ . }}"{{ end }}>
  <div class="code-block-header">
    <span class="code-lang-label">{{ with .Type }}{{ . | upper }}{{ else }}CODE{{ end }}</span>
  </div>
  {{ highlight .Inner .Type .Options }}
</div>
