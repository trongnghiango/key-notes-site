<article class="summary">
  <h2 class="title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
  {{ with .Params.subtitle }}<h3 class="subtitle">{{ . }}</h3>{{ end }}
  {{ partial "postMeta.html" . }}
  <div class="content">
    <p>{{ .Summary }}</p>
    {{ if .Truncated }}
      <p style="margin-top: 8px;"><a href="{{ .Permalink }}" style="font-weight: 600;">Đọc tiếp &rarr;</a></p>
    {{ end }}
  </div>
</article>
